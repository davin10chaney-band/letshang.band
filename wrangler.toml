name = "letshang-band"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "lets-hang-hs"
database_id = "e88995fd-9ca1-47c7-9478-4bdc925f0555"
migrations_dir = "migrations"

# Sheet music, photos and other uploads
[[r2_buckets]]
binding = "FILES"
bucket_name = "letshang-band-files"

# Workers AI: chat guardrails + blocking explicit photos
[ai]
binding = "AI"

[vars]
TIMEZONE = "America/Chicago"
APP_URL = "https://letshang.band"
APP_NAME = "Let's Hang"

[triggers]
crons = ["23 9 * * *"]

[observability]
enabled = true
